services:
  # Ollama — local LLM server (Llama 4)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # PostgreSQL — checkpoints + post storage
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: social_vision
      POSTGRES_USER: svagent
      POSTGRES_PASSWORD: changeme_in_production
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svagent -d social_vision"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis — caching layer
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Application — FastAPI + LangGraph
  app:
    image: ${IMAGE:-ghcr.io/hashirama21/social-vision-agents}:${IMAGE_TAG:-latest}
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      DATABASE_URL: postgresql://svagent:changeme_in_production@postgres:5432/social_vision
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
    depends_on:
      ollama:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../output:/app/output
      - ../knowledge:/app/knowledge
      - ../images:/app/images
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

  # Scheduler — runs weekly pipeline automatically
  scheduler:
    image: ${IMAGE:-ghcr.io/hashirama21/social-vision-agents}:${IMAGE_TAG:-latest}
    env_file:
      - ../.env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      DATABASE_URL: postgresql://svagent:changeme_in_production@postgres:5432/social_vision
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
    depends_on:
      ollama:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../output:/app/output
      - ../knowledge:/app/knowledge
      - ../images:/app/images
    command: ["python", "scheduler.py"]

volumes:
  ollama_data:
  pg_data:
  redis_data:
